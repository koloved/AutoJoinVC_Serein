# AutoJoinVC for Serein. The plugin builds against the bundled copy of the
# Serein extension SDK in `sdk/`; see README.md for the packaging steps.
[workspace]
members = ["sdk", "auto-join-vc"]
resolver = "3"

[workspace.dependencies]
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serein-extension-sdk = { path = "sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
